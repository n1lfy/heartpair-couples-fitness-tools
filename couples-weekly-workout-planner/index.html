<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://heartpair.app/tools/couples-weekly-workout-planner/"><title>Couples weekly workout planner · Heartpair</title><link rel="stylesheet" href="../style.css"><style>body{background:#fff;margin:0}.embed{padding:16px;max-width:720px;margin:0 auto}.embed h1{font-size:20px;margin:0 0 4px}.credit{font-size:12.5px;color:#888;margin-top:12px}</style></head><body><main class="embed tool"><h1>Couples weekly workout planner</h1><div class="tool-box"><div id="wp"></div><div class="out" id="wout"></div></div><p class="credit">Free tool by <a href="https://heartpair.app/tools/couples-weekly-workout-planner/" target="_blank" rel="noopener">Heartpair</a></p></main><script>(function(){var D=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],w=document.getElementById("wp"),o=document.getElementById("wout");var h="<table><thead><tr><th></th>"+D.map(function(d){return"<th>"+d+"</th>"}).join("")+"</tr></thead><tbody>";["You","Partner"].forEach(function(p,r){h+="<tr><td><strong>"+p+"</strong></td>"+D.map(function(d,c){return"<td><input type=checkbox data-r="+r+" data-c="+c+" aria-label='"+p+" "+d+"'></td>"}).join("")+"</tr>"});w.innerHTML=h+"</tbody></table>";function run(){var b=w.querySelectorAll("input"),y=[],p=[];b.forEach(function(x){if(x.checked)(x.dataset.r==="0"?y:p).push(+x.dataset.c)});var both=y.filter(function(c){return p.indexOf(c)>=0}).map(function(c){return D[c]});o.innerHTML="<strong>You: "+y.length+" days · Partner: "+p.length+" days</strong><br>"+(both.length?"Train together on: "+both.join(", "):"No shared days yet. Tick the same day to train together.")+"<br>Set "+y.length+" and "+p.length+" as your weekly targets in Heartpair."}w.addEventListener("change",run);run()})();</script></body></html>
