<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://heartpair.app/tools/couples-steps-goal-calculator/"><title>Couples steps goal calculator · Heartpair</title><link rel="stylesheet" href="../style.css"><style>body{background:#fff;margin:0}.embed{padding:16px;max-width:720px;margin:0 auto}.embed h1{font-size:20px;margin:0 0 4px}.credit{font-size:12.5px;color:#888;margin-top:12px}</style></head><body><main class="embed tool"><h1>Couples steps goal calculator</h1><div class="tool-box"><label for="s1">Your average daily steps</label><input type="number" id="s1" value="6000" min="0" step="500"><label for="s2">Partner's average daily steps</label><input type="number" id="s2" value="5000" min="0" step="500"><label for="up">Push by</label><select id="up"><option value="0.1">+10% (easy)</option><option value="0.2" selected>+20% (challenging)</option><option value="0.3">+30% (hard)</option></select><div class="out" id="sout"></div></div><p class="credit">Free tool by <a href="https://heartpair.app/tools/couples-steps-goal-calculator/" target="_blank" rel="noopener">Heartpair</a></p></main><script>(function(){var a=document.getElementById("s1"),b=document.getElementById("s2"),u=document.getElementById("up"),o=document.getElementById("sout");function r(n){return Math.round(n/500)*500}function run(){var x=+a.value||0,y=+b.value||0,f=1+(+u.value);var t=r((x+y)*f);o.innerHTML="<strong>Combined daily goal: "+t.toLocaleString()+" steps</strong><br>That's about "+r(x*f).toLocaleString()+" for you and "+r(y*f).toLocaleString()+" for your partner, roughly "+(t*0.0007).toFixed(1)+" km together each day."}[a,b,u].forEach(function(e){e.oninput=run;e.onchange=run});run()})();</script></body></html>
