<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://heartpair.app/tools/long-distance-time-zone-planner/"><title>Long-distance time zone planner · Heartpair</title><link rel="stylesheet" href="../style.css"><style>body{background:#fff;margin:0}.embed{padding:16px;max-width:720px;margin:0 auto}.embed h1{font-size:20px;margin:0 0 4px}.credit{font-size:12.5px;color:#888;margin-top:12px}</style></head><body><main class="embed tool"><h1>Long-distance time zone planner</h1><div class="tool-box"><label for="tz1">Your time zone</label><select id="tz1"></select><label for="tz2">Partner's time zone</label><select id="tz2"></select><label for="aw">Awake hours (local)</label><select id="aw"><option value="8-23">08:00 – 23:00</option><option value="7-22">07:00 – 22:00</option><option value="9-24">09:00 – 24:00</option></select><div class="out" id="tzout"></div></div><p class="credit">Free tool by <a href="https://heartpair.app/tools/long-distance-time-zone-planner/" target="_blank" rel="noopener">Heartpair</a></p></main><script>(function(){var z=(Intl.supportedValuesOf?Intl.supportedValuesOf("timeZone"):["Europe/Copenhagen","Europe/London","America/New_York","America/Los_Angeles","Asia/Tokyo","Australia/Sydney"]);var a=document.getElementById("tz1"),b=document.getElementById("tz2"),w=document.getElementById("aw"),o=document.getElementById("tzout");z.forEach(function(t){a.add(new Option(t.replace(/_/g," "),t));b.add(new Option(t.replace(/_/g," "),t))});a.value=Intl.DateTimeFormat().resolvedOptions().timeZone;b.value="America/New_York";function off(t){var d=new Date();var s=d.toLocaleString("en-US",{timeZone:t,hour12:false});return(new Date(s)-new Date(d.toLocaleString("en-US",{timeZone:"UTC",hour12:false})))/36e5}function run(){var r=w.value.split("-").map(Number),d=off(b.value)-off(a.value),h=[];for(var x=0;x<24;x++){var y=((x+d)%24+24)%24;if(x>=r[0]&&x<r[1]&&y>=r[0]&&y<r[1])h.push(x)}function f(n){return String(n).padStart(2,"0")+":00"}if(!h.length){o.innerHTML="<strong>No shared awake hours.</strong> Use weekly targets and log workouts whenever suits you.";return}o.innerHTML="<strong>You're both awake "+h.length+" hours a day.</strong><br>Your time: "+f(h[0])+" – "+f((h[h.length-1]+1)%24)+" · Their time: "+f(((h[0]+d)%24+24)%24)+" – "+f(((h[h.length-1]+1+d)%24+24)%24)+"<br>Time difference: "+(d>0?"+":"")+d+" h"}[a,b,w].forEach(function(e){e.onchange=run});run()})();</script></body></html>
